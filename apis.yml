apis:
- aid: annexus-health:assistpoint-identity
  name: AssistPoint Identity (OpenID Connect)
  description: >-
    The production OpenID Connect / OAuth 2.0 authorization server for the AssistPoint platform,
    served from Annexus Health's own custom domain. Its discovery document is published
    anonymously at /.well-known/openid-configuration and advertises the authorization, token,
    userinfo, device-code, JWKS, dynamic client registration, revocation, and backchannel
    authentication endpoints, fourteen OIDC scopes, PKCE (S256), DPoP, private_key_jwt client
    authentication, and the client_credentials, authorization_code, refresh_token, device_code,
    token-exchange, and jwt-bearer grants. This is the identity tier only — the AssistPoint
    business API behind it is partner-gated and its reference is not public.
  humanURL: https://www.annexushealth.com/assistpoint/
  baseURL: https://login.live.annexushealth.com
  tags:
  - Identity
  - Authentication
  - OpenID Connect
  tags_raw:
  - Identity
  - Authentication
  - OpenID Connect
  - OAuth 2.0
  properties:
  - type: OpenIDConnectDiscovery
    url: https://login.live.annexushealth.com/.well-known/openid-configuration
