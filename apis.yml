aid: annexus-health
name: Annexus Health
description: >-
  Annexus Health is a privately held healthcare technology company headquartered in Cranberry
  Township, Pennsylvania that builds software to reduce the administrative burden of patient
  financial navigation across the patient access journey. Its flagship platform, AssistPoint,
  is an enterprise workflow application used by financial counselors and patient advocates at
  provider organizations to proactively identify, enroll in, and manage copay assistance,
  charitable foundation grants, and manufacturer patient support programs. A companion
  integration layer, AP Connect, creates a two-way secure information exchange between life
  science and foundation patient support programs and AssistPoint, digitally integrating
  enrollment, e-signature, and real-time award balance updates. Annexus Health also publishes
  Adparo, a patient financial navigation service offering. The company reports AssistPoint is
  licensed by 165+ healthcare organizations across 4,200+ sites of care and has processed more
  than $6 billion in patient financial assistance awards since 2018. Its integration and
  developer surface is partner-only: AP Connect is delivered through direct life science and
  foundation partnerships rather than a public developer program, and no public API reference
  or machine-readable specification is published. The publicly reachable machine-readable
  surface is the AssistPoint identity tier — an OpenID Connect authorization server on the
  company's own custom domain — plus a SafeBase-hosted trust center carrying its HITRUST r2
  certification.
